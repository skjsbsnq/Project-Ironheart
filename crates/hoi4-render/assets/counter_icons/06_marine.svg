  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- 顶环 -->
    <circle cx="32" cy="10" r="4"/>
    <!-- 中央直杆 -->
    <line x1="32" y1="14" x2="32" y2="36"/>
    <!-- 横臂 -->
    <line x1="22" y1="18" x2="42" y2="18"/>
    <!-- 底部弯钩（U 形） -->
