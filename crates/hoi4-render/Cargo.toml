[package]
name = "hoi4-render"
version = "0.1.0"
edition = "2021"
# CR-2.1.2 — build.rs 把 assets/counter_icons/*.svg 栅格化为 OUT_DIR/counter_atlas.png。
build = "build.rs"

# Phase 0.2：本 crate 由"二进制入口"退化为"纯渲染库"。
# 主程序入口在 hoi4-app（依赖本 crate + logic/ai/script）。

[dependencies]
clausewitz-parser = { path = "../clausewitz-parser" }
hoi4-map = { path = "../hoi4-map" }
hoi4-data = { path = "../hoi4-data" }
hoi4-state = { path = "../hoi4-state" }
hoi4-assets = { path = "../hoi4-assets" }
wgpu = "24.0.1"
winit = "0.30.9"
pollster = "0.4.0"
bytemuck = { version = "1.25.0", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck"] }
image = "0.25"

# CR-2.1.2 — build-time SVG → PNG atlas 栅格化。仅 build.rs 用，不进运行时二进制。
[build-dependencies]
resvg = { version = "0.44", default-features = false }
usvg = { version = "0.44", default-features = false }
tiny-skia = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
# Phase 3.11.1：用 naga 直接做 wgsl 静态校验，不绕一遍 wgpu device。
naga = "24.0"
