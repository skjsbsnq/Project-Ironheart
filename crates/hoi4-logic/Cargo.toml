[package]
name = "hoi4-logic"
version = "0.1.0"
edition = "2021"

[features]
default = []
vanilla-audit = []

[dependencies]
hoi4-data = { path = "../hoi4-data" }
hoi4-state = { path = "../hoi4-state" }
hoi4-map = { path = "../hoi4-map" }
hoi4-content = { path = "../hoi4-content" }
clausewitz-parser = { path = "../clausewitz-parser" }
tracing = "0.1"
rayon = "1.10"

[dev-dependencies]
hoi4-paths = { path = "../hoi4-paths" }

[[test]]
name = "air_battle"
path = "tests/air_battle.rs"
